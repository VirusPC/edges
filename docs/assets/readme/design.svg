<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img" aria-labelledby="title description">
  <title id="title">Edges 设计：任意目录建立、递归 harness 与跨仓组合</title>
  <desc id="description">三种可按需要采用的结构。任意目录建立：以 monorepo 中的子 app 为例，monorepo/apps/web/ 是本例选定的目录，其中有 AGENTS.md 入口和 .harness 维护材料；同级 admin/ 是普通目录，不表示沿途或所有目录都自动初始化。递归 harness 展示四层：项目、项目的 harness、代码审阅 Skill、Skill 的 harness。项目是维护对象，它的 harness 按需组织任务、记忆与技能。代码审阅 Skill 是其中维护项目的方法；开发或改进这份方法时，Skill 成为新的维护对象，也可以拥有自己的 harness，同样按需采用任务、记忆与技能。项目与 Skill 使用相同白色框，两层 harness 使用相同绿色框，重复表达对象与其维护空间的关系，不表示常规调用时自动加载内层材料或自动自我改进。跨仓组合使用：个人方法仓与团队规范仓各有一条 Compose 虚线箭头指向当前工作区，保留各自归属、历史和选定的引用版本；组合不表示自动同步。实线树表示目录关系，嵌套边框表示包含关系，虚线箭头表示跨仓接入方向。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .ink { fill: #19343c; }
      .muted { fill: #607477; }
      .heading { font-size: 29px; font-weight: 650; fill: #19343c; }
      .node-title { font-size: 26px; font-weight: 600; fill: #19343c; }
      .body { font-size: 23px; fill: #526c70; }
      .plain-node { fill: #ffffff; stroke: #d7e2dc; stroke-width: 1.5; }
      .folder { fill: none; stroke: #68817c; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .selected-folder { fill: none; stroke: #397e70; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="compose-arrow" markerWidth="11" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 7 4-7 4" fill="none" stroke="#5a927c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="1120" rx="24" fill="#f7f8f4"/>
  <path d="M60 48h28" stroke="#1b817b" stroke-width="4" stroke-linecap="round"/>
  <text x="102" y="55" class="muted" font-size="18" font-weight="600" letter-spacing="2">EDGES / 结构设计</text>
  <text x="60" y="112" class="ink" font-size="40" font-weight="650">一套结构，从任意目录开始</text>
  <text x="60" y="155" class="muted" font-size="24">就地建立维护空间，维护方法本身，组合独立积累。</text>

  <!-- Independent structural choices, not automatic initialization stages. -->
  <text x="60" y="220" class="heading">任意目录建立</text>
  <text x="60" y="260" class="body">例如：为 monorepo 中的一个子 app</text>
  <text x="60" y="293" class="body">建立自己的 harness。</text>
  <text x="680" y="220" class="heading">递归 harness</text>
  <text x="680" y="260" class="body">harness 本身，也可以继续 harness。</text>
  <path d="M640 208v494" stroke="#dce5dd" stroke-width="1.5"/>

  <!-- The selected app owns its harness; the other directories remain ordinary. -->
  <path d="M111 378v50h39M173 456v218h39M173 549h39" fill="none" stroke="#c4d2cb" stroke-width="2"/>
  <rect x="88" y="322" width="270" height="56" rx="13" class="plain-node"/>
  <path d="M108 338h10l5 5h14v18h-29z" class="folder"/>
  <text x="151" y="360" class="node-title">monorepo/</text>

  <rect x="150" y="400" width="230" height="56" rx="13" class="plain-node"/>
  <path d="M170 416h10l5 5h14v18h-29z" class="folder"/>
  <text x="213" y="438" class="node-title">apps/</text>

  <rect x="212" y="478" width="380" height="142" rx="16" fill="#eaf3eb" stroke="#91b7a4" stroke-width="2"/>
  <path d="M237 495h10l5 5h14v18h-29z" class="selected-folder"/>
  <text x="281" y="517" class="node-title">web/</text>
  <text x="564" y="515" fill="#527668" font-size="23" text-anchor="end">选定子 app</text>
  <path d="M236 534h330" stroke="#d1e1d5" stroke-width="1"/>
  <path d="M243 546h12l5 5v15h-17zM255 546v6h5" class="selected-folder"/>
  <text x="277" y="565" class="body">AGENTS.md 入口</text>
  <path d="M241 582h8l4 4h10v14h-22z" class="selected-folder"/>
  <text x="277" y="600" class="body">.harness/ 维护材料</text>

  <rect x="212" y="646" width="260" height="56" rx="13" class="plain-node"/>
  <path d="M232 662h10l5 5h14v18h-29z" class="folder"/>
  <text x="275" y="684" class="node-title">admin/</text>

  <!-- Each white maintenance object owns a green harness; the pair repeats inside itself. -->
  <rect x="680" y="322" width="540" height="380" rx="16" class="plain-node"/>
  <text x="706" y="358" class="node-title">项目</text>
  <text x="1194" y="357" class="body" text-anchor="end">维护对象</text>
  <rect x="704" y="378" width="492" height="300" rx="18" fill="#eaf3eb" stroke="#91b7a4" stroke-width="2"/>
  <text x="728" y="414" class="node-title">项目的 harness</text>
  <text x="728" y="449" class="body">按需：任务 · 记忆 · 技能</text>
  <rect x="728" y="469" width="444" height="185" rx="16" class="plain-node"/>
  <text x="752" y="507" class="node-title">代码审阅 Skill</text>
  <text x="1148" y="506" class="body" text-anchor="end">新的维护对象</text>
  <rect x="752" y="527" width="396" height="104" rx="18" fill="#eaf3eb" stroke="#91b7a4" stroke-width="2"/>
  <text x="776" y="563" class="node-title">Skill 的 harness</text>
  <text x="776" y="599" class="body">按需：任务 · 记忆 · 技能</text>

  <path d="M60 734h1160" stroke="#dce5dd" stroke-width="1.5"/>
  <text x="60" y="781" class="heading">跨仓组合使用</text>
  <path d="M758 773h34" stroke="#94b9a7" stroke-width="2"/>
  <text x="806" y="781" class="body">包含关系</text>
  <path d="M986 773h38" stroke="#5a927c" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#compose-arrow)"/>
  <text x="1042" y="781" class="body">跨仓接入</text>
  <text x="60" y="821" class="body">各仓独立维护，以选定版本接入当前工作区。</text>

  <!-- Both Compose connections point into the current workspace, outside the card borders. -->
  <rect x="60" y="876" width="285" height="126" rx="16" class="plain-node"/>
  <text x="202.5" y="921" class="node-title" text-anchor="middle">个人方法仓</text>
  <text x="202.5" y="965" class="body" text-anchor="middle">自身归属与历史</text>

  <path d="M345 952h113" fill="none" stroke="#5a927c" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#compose-arrow)"/>
  <path d="M935 952H822" fill="none" stroke="#5a927c" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#compose-arrow)"/>
  <text x="407.5" y="934" fill="#527668" font-size="23" text-anchor="middle">Compose</text>
  <text x="872.5" y="934" fill="#527668" font-size="23" text-anchor="middle">Compose</text>

  <rect x="470" y="862" width="340" height="154" rx="18" fill="#e9f2e9" stroke="#a7c4b1" stroke-width="1.8"/>
  <text x="640" y="907" class="ink" font-size="28" font-weight="650" text-anchor="middle">当前工作区</text>
  <text x="640" y="949" class="body" text-anchor="middle">登记所用仓库</text>
  <text x="640" y="985" class="body" text-anchor="middle">保留引用版本</text>

  <rect x="935" y="876" width="285" height="126" rx="16" class="plain-node"/>
  <text x="1077.5" y="921" class="node-title" text-anchor="middle">团队规范仓</text>
  <text x="1077.5" y="965" class="body" text-anchor="middle">自身归属与历史</text>

  <text x="640" y="1074" fill="#397e70" font-size="26" font-weight="600" text-anchor="middle">就地建立 · 维护方法本身 · 跨仓组合</text>
</svg>
