<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1400" viewBox="0 0 1280 1400" role="img" aria-labelledby="title description">
  <title id="title">Edges 结构：就地建立、递归维护与平级仓库引用</title>
  <desc id="description">任意目录建立与递归维护：白色框表示被维护对象，绿色框表示 harness。monorepo 中选定的 web 子 app 单独拥有 harness。递归示意依次包含项目、项目的 harness、代码审阅 Skill、Skill 的 harness；项目与 Skill 都能拥有自己的维护空间，按需采用任务、记忆与技能，不表示自动加载内层材料或自动自我改进。跨仓组合使用展示两个平级独立的仓库，外框顶部与底部对齐：个人大脑仓本身就是共享 harness，整仓为绿色且只画一次；白色当前项目仓库包含项目自身的绿色 harness 与白色 Agent。两仓以独立的 Compose 引用虚线相连，保留各自归属与历史以及选定的引用版本。两条实线知识流直接连接同一个个人大脑与项目中的 Agent：青绿色箭头从大脑指向 Agent，表示利用知识与方法；琥珀色箭头从 Agent 指向大脑，表示沉淀新经验。这不是仓库包含关系，也不表示复制合并或自动同步。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .ink { fill: #19343c; }
      .muted { fill: #607477; }
      .heading { font-size: 29px; font-weight: 650; fill: #19343c; }
      .node-title { font-size: 26px; font-weight: 600; fill: #19343c; }
      .body { font-size: 23px; fill: #526c70; }
      .plain-node { fill: #ffffff; stroke: #d7e2dc; stroke-width: 1.5; }
      .folder { fill: none; stroke: #68817c; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .selected-folder { fill: none; stroke: #397e70; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="compose-arrow" markerWidth="11" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 7 4-7 4" fill="none" stroke="#5a927c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="knowledge-arrow" markerWidth="11" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 7 4-7 4" fill="none" stroke="#397e70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="experience-arrow" markerWidth="11" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 7 4-7 4" fill="none" stroke="#b28a47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="1400" rx="24" fill="#f7f8f4"/>
  <path d="M60 48h28" stroke="#1b817b" stroke-width="4" stroke-linecap="round"/>
  <text x="102" y="55" class="muted" font-size="18" font-weight="600" letter-spacing="2">EDGES / 结构设计</text>
  <text x="60" y="112" class="ink" font-size="40" font-weight="650">一套结构，从任意目录开始</text>
  <text x="60" y="155" class="muted" font-size="24">就地建立维护空间，维护方法本身，组合独立积累。</text>

  <!-- Independent structural choices, not automatic initialization stages. -->
  <text x="60" y="220" class="heading">任意目录建立</text>
  <text x="60" y="260" class="body">例如：为 monorepo 中的一个子 app</text>
  <text x="60" y="293" class="body">建立自己的 harness。</text>
  <text x="680" y="220" class="heading">递归 harness</text>
  <text x="680" y="260" class="body">harness 本身，也可以继续 harness。</text>
  <path d="M640 208v528" stroke="#dce5dd" stroke-width="1.5"/>

  <!-- Only the selected app contains a harness; its object frame stays white. -->
  <path d="M111 378v50h39M173 456v252h39M173 520h39" fill="none" stroke="#c4d2cb" stroke-width="2"/>
  <rect x="88" y="322" width="270" height="56" rx="13" class="plain-node"/>
  <path d="M108 338h10l5 5h14v18h-29z" class="folder"/>
  <text x="151" y="360" class="node-title">monorepo/</text>

  <rect x="150" y="400" width="230" height="56" rx="13" class="plain-node"/>
  <path d="M170 416h10l5 5h14v18h-29z" class="folder"/>
  <text x="213" y="438" class="node-title">apps/</text>

  <rect x="212" y="478" width="380" height="178" rx="16" class="plain-node"/>
  <path d="M237 495h10l5 5h14v18h-29z" class="folder"/>
  <text x="281" y="517" class="node-title">web/</text>
  <text x="564" y="515" class="body" text-anchor="end">选定子 app</text>
  <rect x="236" y="535" width="332" height="97" rx="18" fill="#eaf3eb" stroke="#91b7a4" stroke-width="2"/>
  <text x="260" y="573" class="node-title">harness</text>
  <text x="260" y="610" class="body">入口与维护材料</text>

  <rect x="212" y="680" width="260" height="56" rx="13" class="plain-node"/>
  <path d="M232 696h10l5 5h14v18h-29z" class="folder"/>
  <text x="275" y="718" class="node-title">admin/</text>

  <!-- Each white maintenance object owns a green harness; the pair repeats inside itself. -->
  <rect x="680" y="322" width="540" height="380" rx="16" class="plain-node"/>
  <text x="706" y="358" class="node-title">项目</text>
  <text x="1194" y="357" class="body" text-anchor="end">维护对象</text>
  <rect x="704" y="378" width="492" height="300" rx="18" fill="#eaf3eb" stroke="#91b7a4" stroke-width="2"/>
  <text x="728" y="414" class="node-title">项目的 harness</text>
  <text x="728" y="449" class="body">按需：任务 · 记忆 · 技能</text>
  <rect x="728" y="469" width="444" height="185" rx="16" class="plain-node"/>
  <text x="752" y="507" class="node-title">代码审阅 Skill</text>
  <text x="1148" y="506" class="body" text-anchor="end">新的维护对象</text>
  <rect x="752" y="527" width="396" height="104" rx="18" fill="#eaf3eb" stroke="#91b7a4" stroke-width="2"/>
  <text x="776" y="563" class="node-title">Skill 的 harness</text>
  <text x="776" y="599" class="body">按需：任务 · 记忆 · 技能</text>

  <path d="M60 768h1160" stroke="#dce5dd" stroke-width="1.5"/>
  <text x="60" y="815" class="heading">跨仓组合使用</text>
  <rect x="650" y="796" width="28" height="24" rx="5" class="plain-node"/>
  <text x="692" y="815" class="body">维护对象</text>
  <rect x="852" y="796" width="28" height="24" rx="5" fill="#eaf3eb" stroke="#91b7a4" stroke-width="2"/>
  <text x="894" y="815" class="body">harness</text>
  <path d="M1030 807h38" stroke="#5a927c" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1086" y="815" class="body">引用关系</text>
  <text x="60" y="855" class="body">把个人大脑带进项目，在工作中利用知识、沉淀经验。</text>

  <!-- Two peer repositories share the same top and bottom; the brain itself is a harness. -->
  <rect x="60" y="910" width="330" height="400" rx="18" fill="#eaf3eb" stroke="#91b7a4" stroke-width="2"/>
  <text x="225" y="952" class="ink" font-size="28" font-weight="650" text-anchor="middle">个人大脑仓</text>
  <text x="225" y="1003" class="body" text-anchor="middle">整个仓库就是 harness</text>
  <text x="225" y="1044" class="body" text-anchor="middle">自身归属与历史</text>

  <path d="M88 1083h274" stroke="#cfdfd3" stroke-width="1"/>
  <text x="225" y="1165" class="body" text-anchor="middle">可复用的知识与方法</text>
  <text x="225" y="1245" class="body" text-anchor="middle">从项目沉淀的新经验</text>

  <!-- The peer project repository contains its own harness and Agent, with no brain copy. -->
  <rect x="650" y="910" width="570" height="400" rx="18" fill="#ffffff"/>
  <path d="M650 1144V928q0-18 18-18h534q18 0 18 18v364q0 18-18 18H668q-18 0-18-18v-36M650 1176v48" fill="none" stroke="#d7e2dc" stroke-width="1.5"/>
  <text x="678" y="952" class="ink" font-size="28" font-weight="650">当前项目仓库</text>

  <rect x="678" y="980" width="514" height="110" rx="18" fill="#eaf3eb" stroke="#91b7a4" stroke-width="2"/>
  <text x="935" y="1024" class="node-title" text-anchor="middle">项目自身 harness</text>
  <text x="935" y="1063" class="body" text-anchor="middle">项目约定与经验</text>

  <rect x="678" y="1140" width="514" height="142" rx="16" class="plain-node"/>
  <text x="935" y="1197" class="ink" font-size="28" font-weight="650" text-anchor="middle">Agent</text>
  <text x="935" y="1235" class="body" text-anchor="middle">推进当前项目</text>

  <!-- Reference and knowledge flows have separate lanes and different line styles. -->
  <path d="M390 1040H650" fill="none" stroke="#5a927c" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="520" y="1018" fill="#527668" font-size="23" text-anchor="middle">Compose 引用</text>
  <text x="520" y="1080" class="body" text-anchor="middle">保留引用版本</text>

  <path d="M390 1160H666" fill="none" stroke="#397e70" stroke-width="2.5" marker-end="url(#knowledge-arrow)"/>
  <text x="530" y="1138" fill="#397e70" font-size="23" text-anchor="middle">利用知识与方法</text>
  <path d="M678 1240H404" fill="none" stroke="#b28a47" stroke-width="2.5" marker-end="url(#experience-arrow)"/>
  <text x="530" y="1218" fill="#9a7438" font-size="23" text-anchor="middle">沉淀新经验</text>

  <text x="640" y="1360" fill="#397e70" font-size="26" font-weight="600" text-anchor="middle">就地建立 · 维护方法本身 · 跨仓组合</text>
</svg>
