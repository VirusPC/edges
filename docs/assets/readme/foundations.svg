<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" role="img" aria-labelledby="title description">
  <title id="title">Edges 设计基础：积累可掌控，使用可延续</title>
  <desc id="description">四项技术选择及其使用收益，并列呈现而非执行流程。文件系统带来可读与可迁移：Markdown 正文与附件以普通文件和目录保存。Git 带来可追溯与可审阅：diff、历史和审阅让变化可以检查，跟踪与忽略决定哪些内容进入共享版本；忽略规则不是访问控制。跨 Agent 让积累可接续：不同 Agent 使用同一套文件与入口，CLI、Skill、MCP 按已有能力接入，不代表共享会话或所有宿主开箱即用。轻运维指核心内容管理本地可用，需要 Node.js、Git 和 Edges CLI；观测、评测及在线预览按需接入服务。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .ink { fill: #19343c; }
      .muted { fill: #607477; }
      .choice { font-size: 25px; font-weight: 600; fill: #526c70; }
      .benefit { font-size: 30px; font-weight: 650; fill: #19343c; }
      .body { font-size: 23px; fill: #526c70; }
      .card { fill: #ffffff; stroke: #d7e2dc; stroke-width: 1.5; }
      .teal-icon { fill: none; stroke: #367c6b; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .amber-icon { fill: none; stroke: #a57a30; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1280" height="750" rx="24" fill="#f7f8f4"/>
  <path d="M60 48h28" stroke="#1b817b" stroke-width="4" stroke-linecap="round"/>
  <text x="102" y="55" class="muted" font-size="18" font-weight="600" letter-spacing="2">EDGES / 设计基础</text>
  <text x="60" y="112" class="ink" font-size="40" font-weight="650">积累可掌控，使用可延续</text>
  <text x="60" y="155" class="muted" font-size="24">普通文件承载积累，标准入口连接 Agent，按需要接入服务。</text>

  <!-- Four independent choices connect implementation foundations with user benefits. -->
  <rect x="60" y="202" width="564" height="236" rx="20" class="card"/>
  <rect x="84" y="226" width="38" height="38" rx="11" fill="#e5f1eb"/>
  <path d="M92 237h9l5 5h9v13H92z" class="teal-icon"/>
  <text x="137" y="254" class="choice">文件系统</text>
  <text x="88" y="310" class="benefit">可读与可迁移</text>
  <text x="88" y="356" class="body">Markdown 正文与附件</text>
  <text x="88" y="394" class="body">以普通文件和目录保存</text>

  <rect x="656" y="202" width="564" height="236" rx="20" class="card"/>
  <rect x="680" y="226" width="38" height="38" rx="11" fill="#e5f1eb"/>
  <g class="teal-icon">
    <circle cx="691" cy="236" r="3"/>
    <circle cx="707" cy="236" r="3"/>
    <circle cx="691" cy="254" r="3"/>
    <path d="M691 239v12M707 239c0 11-16 1-16 12"/>
  </g>
  <text x="733" y="254" class="choice">Git</text>
  <text x="684" y="310" class="benefit">可追溯与可审阅</text>
  <text x="684" y="356" class="body">用 diff 和历史查看、审阅变化</text>
  <text x="684" y="394" class="body">跟踪与忽略决定哪些进入共享版本</text>

  <rect x="60" y="470" width="564" height="236" rx="20" class="card"/>
  <rect x="84" y="494" width="38" height="38" rx="11" fill="#e5f1eb"/>
  <g class="teal-icon">
    <rect x="91" y="505" width="9" height="15" rx="2"/>
    <rect x="107" y="505" width="9" height="15" rx="2"/>
    <path d="M100 512h7M94 508h3M110 508h3"/>
  </g>
  <text x="137" y="522" class="choice">跨 Agent</text>
  <text x="88" y="578" class="benefit">积累可接续</text>
  <text x="88" y="624" class="body">不同 Agent 使用同一套文件与入口</text>
  <text x="88" y="662" class="body">CLI / Skill / MCP 按已有能力接入</text>

  <rect x="656" y="470" width="564" height="236" rx="20" class="card"/>
  <rect x="680" y="494" width="38" height="38" rx="11" fill="#f7ecd8"/>
  <g class="amber-icon">
    <rect x="688" y="503" width="22" height="16" rx="2"/>
    <path d="M692 523h14M699 519v4M692 508l3 3-3 3M699 514h5"/>
  </g>
  <text x="733" y="522" class="choice">轻运维</text>
  <text x="684" y="578" class="benefit">核心本地可用</text>
  <text x="684" y="624" class="body">Node.js + Git + Edges CLI</text>
  <text x="684" y="662" class="body">观测、评测、在线预览按需接服务</text>
</svg>
