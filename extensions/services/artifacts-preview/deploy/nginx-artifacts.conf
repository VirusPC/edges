# Include inside the same nginx server {} that already serves /teaching/.
# Do not add a second listen 80 / default_server here — IP http must keep
# hitting that existing server so /teaching/ stays intact.
#
# Public BASE_URL is the site origin (no :8787), e.g. http://182.92.131.89
# CLI publish is POST /artifacts (no trailing slash). A lone prefix
# `location /artifacts/` would 301 that to /artifacts/ and break write.

location = /health {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /artifacts {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    client_max_body_size 10m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /artifacts/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    client_max_body_size 10m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
