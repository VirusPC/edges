# Locations for /etc/nginx/conf.d/teaching.conf server {} blocks (listen 80 and 443).
# Canonical public prefix is /teaching/ (repo path teaching/).
# Set root inside location /teaching/ to the absolute repository path,
# e.g. root /srv/edges; so the URI maps to <repo>/teaching/.
# Keep unrelated server/location roots unchanged; the migration adds the override.
#
# teaching.conf must contain /teaching/. If a host still has a leftover site
# file under the old name, rename/replace it to teaching.conf, run
# migrate-teaching-nginx-prefix.py, then: edges artifacts server setup-nginx

location = / {
    return 301 /teaching/;
}

location = /teach {
    return 301 /teaching/;
}

location /teach/ {
    rewrite ^/teach/(.*)$ /teaching/$1 permanent;
}

location /teaching/ {
    root __REPO_ROOT__; # Replace with the absolute repository path.
    try_files $uri $uri/ =404;
}
