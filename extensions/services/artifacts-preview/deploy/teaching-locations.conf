# Locations for /etc/nginx/conf.d/teaching.conf server {} blocks (listen 80 and 443).
# Canonical public prefix is /teaching/ (repo path knowledge/teaching/).
# root should be .../knowledge so /teaching/ maps to knowledge/teaching/.
#
# teaching.conf must contain /teaching/. Live Aliyun ECS already uses this
# file + prefix (verified 2026-09-21). migrate-teaching-nginx-prefix.py is
# one-shot leftover cleanup; after it the conf should have a single
# `location = /` → `/teaching/` (not a stacked duplicate). Then:
# edges artifacts server setup-nginx

location = / {
    return 301 /teaching/;
}

location = /teach {
    return 301 /teaching/;
}

location /teach/ {
    rewrite ^/teach/(.*)$ /teaching/$1 permanent;
}

location /teaching/ {
    try_files $uri $uri/ =404;
}
