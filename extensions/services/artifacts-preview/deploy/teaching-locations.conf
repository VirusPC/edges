# Locations for /etc/nginx/conf.d/teaching.conf server {} blocks (listen 80 and 443).
# Canonical public prefix is /teaching/ (repo path knowledge/teaching/).
# root should be .../knowledge so /teaching/ maps to knowledge/teaching/.
#
# teaching.conf must contain /teaching/. If a host still has a leftover site
# file under the old name, rename/replace it to teaching.conf, run
# migrate-teaching-nginx-prefix.py, then: edges artifacts server setup-nginx

location = / {
    return 301 /teaching/;
}

location = /teach {
    return 301 /teaching/;
}

location /teach/ {
    rewrite ^/teach/(.*)$ /teaching/$1 permanent;
}

location /teaching/ {
    try_files $uri $uri/ =404;
}
