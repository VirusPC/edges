# Locations for /etc/nginx/conf.d/teach.conf server {} blocks (listen 80 and 443).
# Canonical public prefix is /teaching/ (repo path knowledge/teaching/).
# root should be .../knowledge so /teaching/ maps to knowledge/teaching/.
#
# teach.conf must contain /teaching/. If a host still has location /teach/,
# run migrate-teach-nginx-prefix.py (do not teach artifacts inject to match
# /teach/). Then: edges artifacts server setup-nginx

location = / {
    return 301 /teaching/;
}

location = /teach {
    return 301 /teaching/;
}

location /teach/ {
    rewrite ^/teach/(.*)$ /teaching/$1 permanent;
}

location /teaching/ {
    try_files $uri $uri/ =404;
}
