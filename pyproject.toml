[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-agent-sdk-test"
version = "0.1.0"
description = "Starter repository configured for the Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anyio>=4,<5",
  "claude-agent-sdk>=0.1.50",
]

[project.scripts]
claude-agent-sdk-test = "claude_agent_sdk_test.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
