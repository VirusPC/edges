# 只有改到 extensions/cli/** 的 pull request 才自动请 Cursor Bugbot 审查。
#
# Bugbot 按仓库整体开关，不能按目录触发。后台已改为只在评论点名时才跑
# （评论 `bugbot run` 或 `cursor review`）。2026-10-11 在 PR #209 上确认：
# Bugbot 不认 github-actions[bot] 的评论。点名必须用仓库 Secret
# BUGBOT_TRIGGER_TOKEN（peng cheng 本人的 fine-grained PAT，仅 VirusPC/edges，
# Pull requests 与 Issues 读写）。评论会显示为 VirusPC。token 过期后换新 PAT，
# 更新同名 Secret。
#
# Secret 为空时（fork 读不到 Secret，或本仓还没配置）打印提示并成功结束。
# GITHUB_TOKEN 只留 contents: read，不能用它发评论。
#
# 取舍：opened / synchronize / reopened / ready_for_review 都会进来。
# 点名模式下 Bugbot 不会自己跟随后续提交，而它默认做增量审查，所以每次
# 新推送都要点名一次。代价是活跃的 CLI PR 上，每个新提交多一条短评论。
# 同一 head SHA 已经有本工作流的点名时不再发。paths 看整个 PR 相对 base 的
# diff，所以 PR 已经改过 CLI 时，后续没碰该目录的提交仍会再点名。
# concurrency 按 PR 号分组并取消进行中的旧运行，连续推送只保留最新一次。
#
# 安全：用 pull_request，不用 pull_request_target；不 checkout PR 代码。
# 草稿直接跳过。PAT 只限本仓的 Pull requests 与 Issues 读写。
name: 请 Bugbot 审查 CLI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "extensions/cli/**"

permissions:
  contents: read

concurrency:
  group: bugbot-cli-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 评论 bugbot run
        env:
          BUGBOT_TRIGGER_TOKEN: ${{ secrets.BUGBOT_TRIGGER_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "head SHA 格式异常，拒绝评论。" >&2
            exit 1
          fi
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "PR 号格式异常，拒绝评论。" >&2
            exit 1
          fi
          if [ -z "${BUGBOT_TRIGGER_TOKEN}" ]; then
            echo "未配置仓库 Secret BUGBOT_TRIGGER_TOKEN（fork PR 读不到 Secret，或本仓尚未设置）。跳过点名，不请 Bugbot。"
            exit 0
          fi
          # 只用这张 PAT。避免 gh 回退到 GITHUB_TOKEN，再次以 github-actions[bot] 发评论。
          export GH_TOKEN="${BUGBOT_TRIGGER_TOKEN}"
          unset GITHUB_TOKEN
          marker="bugbot-cli-sha:${HEAD_SHA}"
          # 评论按时间正序分页。超过 100 条时，新的点名在后面的页上，必须加总。
          count="$(
            gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq "[.[] | select(.body | contains(\"${marker}\"))] | length" \
              | awk '{s+=$1} END {print s+0}'
          )"
          if [ "$count" != "0" ]; then
            echo "该提交已经点名过 Bugbot，跳过。"
            exit 0
          fi
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          # 第一行必须是触发词。HTML 注释只给本工作流认同一提交，页面上不显示。
          printf '%s\n\n%s\n' 'bugbot run' "<!-- ${marker} -->" > "$body_file"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body_file"
          echo "已为 ${HEAD_SHA} 以 BUGBOT_TRIGGER_TOKEN 的身份评论 bugbot run。"
