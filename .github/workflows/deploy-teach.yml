# SSH into Aliyun ECS and reset the full-repo checkout to origin/main.
# Public entry is the Cloudflare Tunnel HTTPS host (not the bare IP):
#   https://edges.viruspc.tech/teaching/
#   https://edges.viruspc.tech/tasks/
# GitHub allows one environment URL; that primary is /teaching/.
# The job summary lists both paths. Do not use a teach.* hostname.
# ECS can reach GitHub over HTTPS; do not rsync-push a path subset.
# After pull: generate knowledge/tasks/_site for /tasks/ (always; failure
# fails the job). Then edges artifacts server install, then restart, if the
# server env file exists. Never a combined install-and-start. nginx is
# usually unchanged (do not call setup-nginx from this Action).
# Fallback if git fetch from ECS is flaky: from a machine that can reach both
# GitHub and the box, tar the full repo over SSH, then the same two CLI
# commands (or deploy/bootstrap.sh, which is that wrapper).
name: Deploy teaching and tasks sites

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ecs-edges-pull
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://edges.viruspc.tech/teaching/
    steps:
      - name: Public site URLs
        run: |
          {
            echo '## Public site URLs'
            echo
            echo '- [Teaching](https://edges.viruspc.tech/teaching/)'
            echo '- [Tasks](https://edges.viruspc.tech/tasks/)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pull edges on ECS
        env:
          TEACH_DEPLOY_HOST: ${{ secrets.TEACH_DEPLOY_HOST }}
          TEACH_DEPLOY_USER: ${{ secrets.TEACH_DEPLOY_USER }}
          TEACH_DEPLOY_SSH_KEY: ${{ secrets.TEACH_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${TEACH_DEPLOY_HOST:?missing secret TEACH_DEPLOY_HOST}"
          : "${TEACH_DEPLOY_USER:?missing secret TEACH_DEPLOY_USER}"
          : "${TEACH_DEPLOY_SSH_KEY:?missing secret TEACH_DEPLOY_SSH_KEY}"
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$TEACH_DEPLOY_SSH_KEY" > "$key"
          chmod 600 "$key"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H -T 10 "$TEACH_DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i "$key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${TEACH_DEPLOY_USER}@${TEACH_DEPLOY_HOST}" \
            'set -euo pipefail
             cd /home/cheng-dev/projects/edges
             git fetch origin main
             git checkout main
             git reset --hard origin/main
             git --no-pager status -sb
             git rev-parse HEAD
             export PATH="${HOME}/.local/share/pnpm:${HOME}/.local/bin:/usr/local/bin:${PATH}"
             if [ -s "${NVM_DIR:-$HOME/.nvm}/nvm.sh" ]; then
               export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
               . "$NVM_DIR/nvm.sh"
             fi
             if [ ! -d node_modules ]; then
               pnpm install --frozen-lockfile --filter edges-cli...
             fi
             pnpm --filter edges-cli exec -- tsx scripts/generate-tasks-site.ts \
               --out "$PWD/knowledge/tasks/_site/index.html"
             test -s knowledge/tasks/_site/index.html
             env_file="$HOME/.config/edges/artifacts-preview.env"
             token=""
             if [ -f "$env_file" ]; then
               token="$(grep -m1 "^EDGES_ARTIFACTS_TOKEN=" "$env_file" | cut -d= -f2- || true)"
             fi
             if [ -n "$token" ] && [ "$token" != "replace-with-shared-token" ]; then
               export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
               if [ -z "${DBUS_SESSION_BUS_ADDRESS:-}" ] && [ -S "${XDG_RUNTIME_DIR}/bus" ]; then
                 export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
               fi
               # Pull already succeeded. Failure here fails the job so a
               # dead artifacts unit is visible; teach files are already new.
               if ! command -v edges >/dev/null 2>&1; then
                 pnpm install --frozen-lockfile --filter edges-cli...
               fi
               if command -v edges >/dev/null 2>&1; then
                 edges artifacts server install
                 edges artifacts server restart
               else
                 pnpm --filter edges-cli exec -- tsx src/index.ts artifacts server install
                 pnpm --filter edges-cli exec -- tsx src/index.ts artifacts server restart
               fi
             else
               echo "skip artifacts server: $env_file missing or token unused (one-time: artifacts-preview README)"
             fi'
